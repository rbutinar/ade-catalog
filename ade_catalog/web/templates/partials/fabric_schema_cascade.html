{% if schemas %}
<div class="flex-1 min-w-[140px]">
    <label class="block text-xs text-gray-500 mb-1">Schema</label>
    <select name="filter_schema"
            class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-xs bg-white">
        <option value="">All schemas</option>
        {% for s in schemas %}
        <option value="{{ s.schema_name }}">{{ s.schema_name }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
