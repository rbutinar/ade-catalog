{% if notebooks|length > 0 %}
<div class="border-l border-gray-200 ml-2">
    {% for nb in notebooks %}
    <a href="/detail/notebook/{{ nb.notebook_id }}"
       class="flex items-center gap-2 px-4 py-2 hover:bg-sky-50 transition-colors text-sm group">
        <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-sky-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="truncate text-gray-700 group-hover:text-sky-700">{{ nb.notebook_name }}</span>
        {% if nb.layer %}
        <span class="ml-auto text-xs flex-shrink-0
              {% if nb.layer == 'bronze' %}text-amber-600
              {% elif nb.layer == 'silver' %}text-gray-500
              {% elif nb.layer == 'gold' %}text-yellow-600
              {% else %}text-slate-400{% endif %}">
            {{ nb.layer }}
        </span>
        {% endif %}
    </a>
    {% endfor %}
</div>
{% else %}
<p class="px-4 py-2 text-xs text-gray-400 italic">No notebooks</p>
{% endif %}
